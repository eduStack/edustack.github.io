- id: jeong-2021-parenting-interventions
  type: research
  evidence: large
  title:
    en: "Early parenting support: what a global review found"
    zh: 早期养育支持：一项全球综述发现了什么
  by: Jeong J, Franchett EE, Ramos de Oliveira CV, Rehmani K, Yousafzai AK
  year: 2021
  url: https://doi.org/10.1371/journal.pmed.1003602
  language: English
  free: true
  minMonths: 0
  maxMonths: 35
  sex: all
  topics:
    - responsive-care
    - development
    - attachment
  summary:
    en: >-
      Across 102 randomised trials in 33 countries, parenting programmes in the first three years improved
      several child-development and caregiving outcomes. Results varied, and parental depressive symptoms did
      not improve significantly overall.
    zh: 汇总 33 个国家的 102 项随机试验，前三年的养育项目改善了多项儿童发展和照护结果，但效果存在差异，家长抑郁症状总体未见显著改善。
  design: meta-analysis
  doi: 10.1371/journal.pmed.1003602
  purpose:
    en: What evidence supports organised early-parenting support, and what should not be promised?
    zh: 有组织的早期养育支持有哪些证据，又不能承诺什么？
  audience:
    en: >-
      Caregivers and readers interested in programmes delivered during the first three years. The review
      covers varied interventions, settings and participants.
    zh: 关注出生后前三年养育项目的照顾者与读者；综述中的干预、场景与参与家庭各不相同。
  whyAge:
    en: The evidence concerns interventions in the first three years, not the whole 0–18 age range.
    zh: 证据针对前三年的干预，不能外推至整个 0–18 岁。
  keyPoints:
    en:
      - Cognitive, language, motor, social-emotional and some parenting outcomes improved on average.
      - Effects differed by outcome and programme; caregiver depression did not improve significantly overall.
      - Long-term follow-up and implementation in different local settings remain important.
    zh:
      - 认知、语言、运动、社会情绪及部分养育结果平均有所改善。
      - 不同结果与项目的效果不同；照顾者抑郁总体未显著改善。
      - 长期随访与不同地区的实际实施仍是重要问题。
  actions:
    en:
      - Use this review to understand the rationale for responsive-care resources.
      - >-
        When considering a programme, check its age range, content, support and evaluation rather than
        borrowing the review’s average effect.
    zh:
      - 借此理解回应式照护资源的研究背景。
      - 选择项目时核对年龄、内容、支持方式和评估，不把综述平均效果当作个体收益。
  limits:
    en: >-
      A review of structured interventions does not prove that a website, short article or isolated activity
      produces the same benefit. Programme variation, study reporting and limited long-term data restrict
      generalisation.
    zh: 结构化干预综述不能证明网站、短文章或单项活动有相同收益。项目差异、研究报告与长期数据有限，限制了外推。
  evidenceNote:
    en: >-
      Systematic review and meta-analysis of randomised trials; the pooled results do not validate eduStack as
