# Every resource in the library.
# Rules (enforced by scripts/validate-data.mjs):
#   - url is required and must point to the original source
#   - type: book | classic (historical reading) | guide (practical resource) | guideline | research
#   - evidence: guideline | large | small | expert
#       guideline = official guideline from an authoritative body
#       large     = large study, systematic review or meta-analysis
#       small     = single small study
#       expert    = expert opinion, consensus statement or book
#   - minMonths / maxMonths: the ages (in months) this resource is useful for, 0–215
#   - sex: all | male | female  (only for growth and puberty content)
#   - summary/whyAge/keyPoints/actions are short summaries in our words; the source is authoritative
#   - checked: date the link and details were last verified (YYYY-MM-DD)
#   - research items are not browsed on their own. They appear as "the research behind it"
#     under the topics, stages and recommendations that list them. They need:
#       design: meta-analysis | review | trial | cohort | experiment | observational | cross-sectional | large-dataset
#     and their summary must state the finding in plain language first.
#   - backedBy: research ids shown under a book or guideline as "the research behind it"
#   - books also need isbn and publisher, and may have evidenceNote (shown in "further reading").
#     A WorldCat library link is built from the isbn. No affiliate links.
#   - guides and classic readings also explain purpose, audience, limits, access and checkedNote.
#     Their stage tags are editorial selections; the audience text preserves the source's actual scope.

- id: who-under5-activity-sleep-2019
  type: guideline
  evidence: guideline
  title:
    en: Guidelines on physical activity, sedentary behaviour and sleep for children under 5 years of age
    zh: WHO 5 岁以下儿童身体活动、久坐行为和睡眠指南
  by: World Health Organization
  year: 2019
  url: https://www.who.int/publications/i/item/9789241550536
  isbn: 978-92-4-155053-6
  language: English, with other WHO language editions
  free: true
  minMonths: 0
  maxMonths: 59
  sex: all
  topics: [sleep, activity, screen-time]
  backedBy: [madigan-2019-screen-development, madigan-2020-screen-language]
  core: true
  summary:
    en: The first WHO guideline to look at movement, sitting and sleep together for young children. It gives daily numbers for each age group.
    zh: 世界卫生组织第一份把运动、久坐和睡眠放在一起考虑的低龄儿童指南，按年龄分段给出每天的具体数字。
  whyAge:
    en: It covers children under 5 in three groups (under 1, 1–2 and 3–4 years). For ages 5 to 17, see the WHO 2020 guidelines.
    zh: 指南只针对 5 岁以下儿童，分为 1 岁以下、1–2 岁、3–4 岁三段。5–17 岁请看 WHO 2020 年指南。
  keyPoints:
    en:
      - "Under 1: active several times a day, including at least 30 minutes on the tummy if not yet mobile; screen time not recommended; 14–17 hours of sleep at 0–3 months and 12–16 hours at 4–11 months."
      - "1–2 years: at least 180 minutes of activity at any intensity; no sedentary screen time at age 1 and no more than 1 hour at age 2; 11–14 hours of sleep."
      - "3–4 years: at least 180 minutes of activity including 60 minutes moderate to vigorous; no more than 1 hour of sedentary screen time; 10–13 hours of sleep."
    zh:
      - "1 岁以下：每天多次活动，还不会爬的婴儿每天至少俯趴 30 分钟；不建议看屏幕；0–3 个月睡 14–17 小时，4–11 个月睡 12–16 小时。"
      - "1–2 岁：每天至少 180 分钟各种强度的活动；1 岁不建议久坐看屏幕，2 岁不超过 1 小时；睡 11–14 小时。"
      - "3–4 岁：每天至少 180 分钟活动，其中至少 60 分钟中高强度；久坐看屏幕不超过 1 小时；睡 10–13 小时。"
  actions:
    en:
      - Avoid keeping children restrained for more than an hour at a time, for example in a pram or car seat.
      - When children are sitting still, read and tell stories together.
      - Keep regular sleep and wake-up times.
    zh:
      - 不要让孩子一次被束缚超过 1 小时，比如长时间坐在推车或安全座椅里。
      - 孩子安静坐着的时候，大人陪着一起读书、讲故事。
      - 保持规律的入睡和起床时间。
  checked: 2026-11-13

