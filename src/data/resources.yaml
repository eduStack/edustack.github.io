  summary:
    en: >-
      A classic work about education in the home, with an emphasis on habits, judgement, character and the
      example set by adults. Read it as a historical argument rather than a modern childcare manual.
    zh: 一部讨论家庭教育的经典著作，关注习惯、判断、品格与成人示范。适合当作历史思想阅读，不作为现代照护手册照做。
  purpose:
    en: How do repeated experiences, the home environment and adult behaviour shape education?
    zh: 反复的经验、家庭环境和成人行为如何参与教育？
  audience:
    en: >-
      Caregivers reflecting on habits and education from preschool through adolescence. These stage tags are
      our editorial choice, not Locke’s empirically established age ranges.
    zh: 供学龄前至青春期的照顾者反思习惯与教育。阶段标签是本站编辑选择，不是洛克经实证建立的年龄范围。
  whyAge:
    en: >-
      Habits and adult example matter across stages, but modern expectations must account for a child’s
      development and circumstances.
    zh: 习惯与成人示范可跨阶段讨论，但现代实践仍需考虑孩子的发展与具体条件。
  keyPoints:
    en:
      - The work grew from advice about a particular family’s child and was first published in 1693.
      - Its educational setting differs from universal schooling and inclusive education today.
      - It offers questions about habits and example, not modern evidence for every historical practice.
    zh:
      - 该书源自对特定家庭孩子教育的建议，初版为 1693 年。
      - 其教育背景与今天的普及教育、包容教育不同。
      - 可用它思考习惯与示范，不代表其中历史做法都有现代证据。
  actions:
    en:
      - >-
        Reflect on what everyday routines and adult examples communicate, rather than relying only on
        instructions to the child.
      - >-
        Compare a historical claim with current developmental evidence and guidelines before considering
        action.
    zh:
      - 观察日常安排和成人示范传递了什么，而不只给孩子口头要求。
      - 考虑行动前，将历史主张与当代发展研究和指南对读。
  limits:
