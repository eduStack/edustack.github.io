- id: alfieri-2011-discovery
  type: research
  evidence: large
  design: meta-analysis
  title:
    en: Does discovery-based instruction enhance learning?
    zh: 发现式教学能促进学习吗？
  by: Alfieri et al., Journal of Educational Psychology
  year: 2011
  url: https://doi.org/10.1037/a0021017
  doi: 10.1037/a0021017
  language: English
  free: false
  minMonths: 36
  maxMonths: 215
  sex: all
  topics: [learning]
  summary:
    en: Learners left to discover things entirely on their own learned less than with explicit teaching, but discovery with support - feedback, worked examples or being asked to explain - worked better than other methods.
    zh: 完全让学习者自己去发现，效果不如直接讲解；但有支持的发现式学习（及时反馈、示范例题、让孩子说出理由）比其他方法效果更好。
  checked: 2026-11-13

