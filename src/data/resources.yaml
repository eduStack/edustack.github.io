# First curated batch: practical resources, classic readings and research.
- id: harvard-serve-and-return
  type: guide
  evidence: expert
  title:
    en: "Serve and return: noticing and responding to your child"
    zh: 回应式互动：留意并接住孩子的表达
  by: Center on the Developing Child at Harvard University
  year: null
  url: https://developingchild.harvard.edu/key-concept/serve-and-return/
  language: English
  free: true
  minMonths: 0
  maxMonths: 71
  sex: all
  topics:
    - responsive-care
    - attachment
    - language
    - communication
  summary:
    en: >-
      A university explainer about the back-and-forth between a young child and a caring adult: notice a look,
      sound or gesture, respond, and leave room for the child to respond again.
    zh: 哈佛儿童发展中心介绍幼儿与照顾者的来回互动：留意一个目光、声音或动作，作出回应，再给孩子继续表达的空间。
  yearNote:
    en: Undated concept page
    zh: 概念说明页，未标独立发表年份
  purpose:
    en: What does responsive interaction look like during ordinary care, before a child can hold a conversation?
    zh: 孩子还不会对话时，日常照护中的“回应”可以是什么样？
  audience:
    en: >-
      Parents and other caregivers of babies and young children. Our stage tags cover birth through age 5;
      they are not a developmental test.
    zh: 婴幼儿与低龄儿童的父母及其他照顾者。本站关联 0–5 岁阶段，不作为发展测验。
  whyAge:
    en: >-
      Looks, gestures and sounds can all start an exchange. Adapt your response to this child rather than
      expecting words or eye contact on demand.
    zh: 目光、动作与声音都可以开启交流。按孩子的表达方式回应，不要求孩子必须说话或按要求进行眼神接触。
  keyPoints:
    en:
      - The exchange follows a child’s signal, not a fixed lesson.
      - Naming what a child notices or feels can make the interaction meaningful.
      - "Caregivers also need support: stress and difficult living conditions can make responsive care harder."
    zh:
      - 从孩子的信号开始，不必把互动变成固定课程。
      - 为孩子留意的事物或感受配上语言，让交流更有意义。
      - 照顾者也需要支持，压力与生活困难会增加回应式照护的难度。
  actions:
    en:
      - >-
        During an everyday moment, notice what catches your child’s attention and respond with a word, sound
        or gesture.
      - Pause to let the child take a turn; stop or change the activity if they disengage.
      - Read the official concept page and its linked five-step handout for examples.
    zh:
      - 在日常照护中留意孩子正在关注什么，用语言、声音或动作回应。
      - 停一停，让孩子接下一轮；孩子不想继续时，结束或换一种活动。
      - 从官方概念页及其关联的五步互动材料了解示例。
  limits:
    en: >-
      This is a developmental explanation, not a treatment or a promise about future ability. There is no
      fixed daily quota here. Missing one interaction does not determine attachment or development.
    zh: 这是发展知识说明，不是治疗方案，也不保证未来能力。这里没有统一的每日互动次数；漏掉一次回应并不决定依恋或发展结果。
  evidenceNote:
    en: >-
      Expert explanation from a university centre. Related intervention research concerns structured
      programmes, not the effect of reading this page.
    zh: 大学研究中心的专业解释。关联干预研究针对有结构的项目，不是阅读本页的效果。
  access:
    en: >-
      The official page is free to read in English. This is our original summary; follow the source’s terms
      before reusing its text or images.
    zh: 官方英文页面可免费阅读。本站提供原创摘要；复用原文或图片前需另查来源条款。
  checkedNote:
    en: >-
      Checked the official concept page, including its explanation of caregiver stress and responsive
      exchanges. We have not audited every linked video or handout.
    zh: 已核对官方概念页中回应互动与照顾者压力的说明；未逐项审读全部关联视频和材料。
  backedBy:
    - jeong-2021-parenting-interventions
    - bakermans-2003-sensitivity-attachment
  checked: "2026-11-14"
  originalTitle: Serve and Return
