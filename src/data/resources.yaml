- id: us-surgeon-general-social-media-2023
  type: guideline
  evidence: guideline
  title:
    en: "Social Media and Youth Mental Health: The U.S. Surgeon General's Advisory"
    zh: 社交媒体与青少年心理健康：美国卫生总监公告
  by: US Surgeon General
  year: 2023
  url: https://www.hhs.gov/surgeongeneral/reports-and-publications/youth-mental-health/social-media/index.html
  language: English
  free: true
  minMonths: 96
  maxMonths: 215
  sex: all
  topics: [social-media, mental-health]
  backedBy: [orben-2019-wellbeing-tech]
  summary:
    en: Reviews what is known and not yet known about social media and youth mental health, and asks families, companies and policymakers to act.
    zh: 梳理社交媒体与青少年心理健康之间已知和未知的关系，呼吁家庭、企业和政策制定者采取行动。
  actions:
    en:
      - Make a family media plan that sets limits, including for social media.
      - Create tech-free zones at home and encourage in-person friendships.
      - Model responsible use yourself.
      - Teach children about technology and how to take part online responsibly.
      - Report cyberbullying, online abuse and exploitation.
    zh:
      - 制定家庭媒体使用计划，包括社交媒体的使用限制。
      - 在家里设立不用电子设备的区域，鼓励孩子线下交朋友。
      - 家长自己做好负责任使用的示范。
      - 教孩子了解技术，学会负责任地参与网络生活。
      - 遇到网络欺凌、网络虐待和剥削要举报。
  checked: 2026-11-13

- id: apa-social-media-advisory-2023
  type: guideline
  evidence: guideline
  title:
    en: Health advisory on social media use in adolescence
    zh: 青少年社交媒体使用健康建议（美国心理学会）
  by: American Psychological Association
  year: 2023
  url: https://www.apa.org/topics/social-media-internet/health-advisory-adolescent-social-media-use
  language: English
  free: true
  minMonths: 120
  maxMonths: 215
  sex: all
  topics: [social-media, mental-health]
  backedBy: [orben-2019-wellbeing-tech]
  summary:
    en: Ten recommendations based on the research to date, including adult monitoring in early adolescence, protecting sleep and physical activity, and social media literacy training before use begins.
    zh: 基于现有研究的 10 条建议，包括青春期早期由大人监督、保护睡眠和运动时间、开始使用前先学习社交媒体素养。
  actions:
    en:
      - In early adolescence (about 10–14), adult monitoring is advised for most young people; allow more independence as they mature.
      - Keep social media from cutting into sleep (at least 8 hours) or physical activity. Use within an hour of bedtime is linked to poorer sleep.
      - Limit comparison-driven content, especially about appearance.
      - Teach social media literacy before your child starts using it.
    zh:
      - 青春期早期（约 10–14 岁）建议大人对多数孩子进行监督，随着成熟逐步放手。
      - 不要让社交媒体挤占睡眠（至少 8 小时）和运动时间。睡前一小时内使用与睡眠变差有关。
      - 减少容易引发攀比的内容，特别是关于外貌的内容。
      - 在孩子开始使用之前，先教他们社交媒体素养。
  checked: 2026-11-13

