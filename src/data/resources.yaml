  audience:
    en: >-
      Readers interested in infant attachment and early caregiving. Our early-years tags identify a relevant
      topic, not a diagnostic age window or a complete statement of every included study’s ages.
    zh: 关注婴儿依恋与早期照护的读者。本站早期阶段标签用于主题关联，不是诊断年龄窗口，也不代表已核清全部纳入研究的年龄。
  whyAge:
    en: >-
      The abstract concerns sensitivity and infant attachment in early childhood; detailed age and programme
