- id: madigan-2020-screen-language
  type: research
  evidence: large
  design: meta-analysis
  title:
    en: Associations Between Screen Use and Child Language Skills
    zh: 屏幕使用与儿童语言能力的关联（系统综述与元分析）
  by: Madigan et al., JAMA Pediatrics
  year: 2020
  url: https://doi.org/10.1001/jamapediatrics.2020.0327
  doi: 10.1001/jamapediatrics.2020.0327
  language: English
  free: false
  minMonths: 0
  maxMonths: 155
  sex: all
  topics: [screen-time, language]
  core: true
  summary:
    en: A meta-analysis of 42 studies. More screen use was linked to weaker language skills, while co-viewing with an adult and better-quality programmes were linked to stronger skills.
    zh: 汇总 42 项研究的元分析：屏幕使用越多，语言能力越弱；而大人陪看和更优质的节目与更强的语言能力相关。
  checked: 2026-11-13

