      and examining ideas, rather than reward the repetition of other people’s words.
    zh: 《随笔集》中的教育篇章，讨论通过交谈、经验和审视观点培养判断力，不把复述别人的话当成学习的终点。
  yearNote:
    en: 16th-century essay; Cotton/Hazlitt English edition
    zh: 16 世纪篇章；Cotton/Hazlitt 英译本
  purpose:
    en: How can a parent tell whether a child understands an idea rather than only remembers the wording?
    zh: 怎样了解孩子是在理解，还是只记住了表述？
  audience:
    en: >-
      Caregivers of school-age children and teenagers. This is an adult reflection on education; the stage
      tags are an editorial connection, not a child reading requirement.
    zh: 学龄儿童与青少年的照顾者。它供成人反思教育；本站阶段标签不是孩子的必读要求。
  whyAge:
    en: It connects with conversations about reading and schoolwork, without prescribing an age-based method.
    zh: 可联系阅读、作业中的交流，不提供按年龄规定的教学方法。
  keyPoints:
    en:
      - A learner should examine ideas and make sense of them rather than merely repeat an authority.
      - Conversation and experience are part of education.
      - The essay addresses a historical setting involving private tutors and privileged boys.
    zh:
      - 学习者需要审视并理解观点，而不只是复述权威。
      - 交谈与经验也是教育的一部分。
      - 篇章的历史背景涉及私人导师和特权家庭男孩的教育。
  actions:
    en:
      - Invite the child to explain an idea in their own words and offer a different example.
      - Treat disagreement as a chance to ask for reasons, while remaining open to changing your own view.
    zh:
      - 邀请孩子用自己的话解释一个观点，再举一个不同的例子。
      - 有分歧时询问理由，也给自己保留改变看法的空间。
  limits:
