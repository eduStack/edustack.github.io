    - learning
    - emotions
    - play
  summary:
    en: >-
      A review of 49 studies covering 50 interventions and 23,098 participants aged 2–17 found that several
      approaches can support self-regulation. Programmes and outcome measures differed substantially.
    zh: 一项综述涵盖 49 项研究、50 项干预和 23,098 名 2–17 岁参与者，发现多种方法可以支持自我调节，但项目和测量方式差异明显。
  design: meta-analysis
  doi: 10.1001/jamapediatrics.2018.0232
  purpose:
    en: >-
      Is self-regulation only about willpower, or can relationships, activities and learning environments
      help?
    zh: 自我调节只靠意志力，还是关系、活动和学习环境也能提供支持？
  audience:
    en: >-
      Caregivers, educators and readers interested in self-regulation. Actual participants were aged 2–17,
      across school, community and family programmes.
    zh: 关注自我调节的照顾者、教育工作者与读者。实际参与者为 2–17 岁，涉及学校、社区与家庭项目。
  whyAge:
    en: The study range is broad; a preschool activity should not automatically be used for a teenager.
    zh: 研究年龄范围较广，学龄前活动不能直接用于青少年。
  keyPoints:
    en:
      - Interventions included curricula, family programmes, exercise, and social and personal skills.
      - >-
        The pooled task-performance effect drew on 19 studies, not all 49; report-based measures were too
        heterogeneous for the same pooling.
      - Longer-term educational and health outcomes were reported by fewer studies.
    zh:
      - 干预涉及课程、家庭项目、运动和社会与个人技能。
      - 任务表现的合并效果来自 19 项研究，并非全部 49 项；报告式测量差异太大，未以同样方式合并。
      - 只有较少研究报告较长期的教育与健康结果。
  actions:
    en:
      - Use the review to ask what skill an activity supports and how adults help.
      - >-
        Read age-specific activity guidance alongside the review; choose manageable challenges rather than
        ranking children’s self-control.
    zh:
      - 借此询问活动支持什么能力，以及成人怎样提供帮助。
      - 结合分龄活动指南阅读，选择可完成的挑战，不按自控表现给孩子排名。
  limits:
    en: >-
      The review was limited to published English-language studies and many studies were from the US.
      Heterogeneous measures and programmes limit claims about one best approach or long-term transfer. It is
