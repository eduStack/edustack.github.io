    zh: 综述限于已发表英文研究，且很多来自美国。测量与项目差异限制了“最佳方法”和长期迁移的判断，不能据此说单个认知游戏会全面改善能力。
  evidenceNote:
    en: Review of randomised interventions; task-based and report-based outcomes need to be distinguished.
    zh: 随机干预综述；需区分任务测量与报告测量的结果。
