- id: pandey-2018-self-regulation
  type: research
  evidence: large
  title:
    en: Self-regulation can be supported in different ways
    zh: 支持自我调节：不只有一种训练方法
  by: Pandey A, Hale D, Das S, Goddings AL, Blakemore SJ, Viner RM
  year: 2018
  url: https://doi.org/10.1001/jamapediatrics.2018.0232
  language: English
