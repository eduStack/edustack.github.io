  language: English
  free: true
  minMonths: 6
  maxMonths: 215
  sex: all
  topics:
    - self-regulation
    - play
    - learning
  summary:
    en: >-
      An age-grouped collection of games and activities for practising working memory, inhibitory control and
      flexible thinking, with adults gradually adjusting their help.
    zh: 按年龄分组的游戏与活动材料，围绕工作记忆、抑制控制和灵活思考，说明成人如何逐步调整帮助。
  purpose:
    en: >-
      How can we practise remembering, taking turns, planning and changing approach through enjoyable
      activities?
    zh: 怎样在有趣的活动中练习记忆、轮流、计划和调整做法？
  audience:
    en: >-
      Caregivers and educators. Activity sections start at 6–18 months, then 18–36 months, 3–5, 5–7, 7–12
      years and adolescence. Our tags include only the under-18 portion.
    zh: 照顾者与教育工作者。活动原文分为 6–18 个月、18–36 个月、3–5 岁、5–7 岁、7–12 岁及青春期；本站只关联其中未满 18 岁的部分。
  whyAge:
    en: >-
      Use the relevant section as a starting point and adjust to the child’s interests and abilities. The age
      bands do not define an ability score.
    zh: 以相应年龄章节为起点，再按兴趣与能力调整；年龄分组不是能力评分标准。
  keyPoints:
    en:
      - The introduction distinguishes working memory, inhibitory control and cognitive flexibility.
      - >-
        The guide includes hiding games for infants, rule-based games for older children, and planning and
        reflection for adolescents.
      - Adults support a challenge, then step back as the child is ready.
    zh:
      - 导言区分工作记忆、抑制控制与认知灵活性。
      - 指南包括婴儿藏物游戏、较大儿童的规则游戏，以及青春期的计划与反思。
      - 成人先帮助孩子应对挑战，再在孩子准备好时逐步退后。
  actions:
    en:
      - Open one age-specific section rather than trying to complete the whole guide.
      - >-
        Choose one activity with suitable materials and adult supervision, and simplify it if it is
        frustrating.
      - >-
        Notice whether the child enjoys and understands the activity; do not turn it into a speed or ability
        test.
    zh:
      - 先打开一个年龄章节，不必完成整套指南。
      - 选一项材料合适、成人可陪同的活动；挫折过大时降低难度。
      - 观察孩子是否投入、是否理解玩法，不把活动变成速度或能力测试。
  limits:
    en: >-
      The guide itself says that not all suggested activities have been individually proven effective. It is
      not ADHD treatment, a diagnostic checklist or a guarantee of higher intelligence or grades.
    zh: 指南自己说明，并非每个建议活动都已单独验证效果。它不是 ADHD 治疗、诊断清单，也不保证提高智力或成绩。
  evidenceNote:
    en: >-
      Expert activity guide with references; the evidence for self-regulation interventions does not validate
      every activity in this collection.
    zh: 附参考文献的专业活动指南；自我调节干预的总体证据不等于验证了其中每项活动。
  access:
    en: >-
      The official page provides free English downloads and some translated editions. Check each edition and
      its reuse terms; the website summary is not a complete translation.
    zh: 官方提供免费英文下载及部分其他语言版本。各版语言和使用许可需分别查看；本站摘要不是全本翻译。
  checkedNote:
    en: >-
      Read the official introduction and the English PDF’s introduction and age-group activity sections. The
      PDF has 17 file pages including its cover; the official page describes a 16-page guide.
    zh: 已读官方介绍及英文 PDF 的导言和分龄活动章节。PDF 含封面共 17 个文件页，官方介绍称正文指南为 16 页。
  sourceLinks:
    - label:
        en: Official English activity guide (PDF)
        zh: 官方英文活动指南（PDF）
      url: >-
        https://developingchild.harvard.edu/wp-content/uploads/2024/10/Enhancing-and-Practicing-Executive-Function-Skills-with-Children-from-Infancy-to-Adolescence-1.pdf
  backedBy:
    - pandey-2018-self-regulation
  checked: "2026-11-14"
  originalTitle: Enhancing and Practicing Executive Function Skills with Children from Infancy to Adolescence
- id: who-early-childhood-development-2020
  type: guideline
  evidence: guideline
  title:
    en: "Improving early childhood development: responsive care and family support"
    zh: WHO 儿童早期发展指南：回应照护与家庭支持
  by: World Health Organization
  year: 2020
  url: https://www.who.int/publications/i/item/97892400020986
  language: English
  free: true
  minMonths: 0
  maxMonths: 35
  sex: all
  topics:
    - responsive-care
    - development
    - mental-health
  summary:
    en: >-
      WHO guidance brings together responsive caregiving, early learning, nutrition services and support for
      maternal mental health during the first three years of life.
    zh: WHO 将出生后前三年的回应式照护、早期学习、营养服务与母亲心理健康支持放在同一框架中考虑。
  purpose:
    en: What support matters in the first three years, beyond buying early-learning products?
    zh: 出生后前三年，除了购买早教产品，哪些照护和家庭支持值得关注？
  audience:
    en: >-
      The recommendations concern the first three years. The guideline is primarily for people planning and
      delivering services; this page is a caregiver introduction.
    zh: 建议重点针对出生后前三年。原指南主要面向服务规划和提供者；本页为照顾者导读。
  whyAge:
    en: >-
      The recommendations focus on early childhood; this is not the only framework needed for school-age
      children or teenagers.
    zh: 原建议聚焦儿童早期，不能用它概括学龄儿童和青少年的全部需要。
  keyPoints:
    en:
      - Responsive care and early-learning opportunities should be supported in the first three years.
      - Care and learning support can be integrated with nutrition services.
      - Maternal mental-health support belongs within early-childhood services.
    zh:
      - 在前三年支持回应式照护和早期学习机会。
      - 照护、学习支持可与营养服务结合。
      - 母亲心理健康支持应纳入儿童早期服务。
  actions:
    en:
      - >-
        Use the guideline to understand the kinds of support to ask an early-childhood or health service
        about.
      - >-
        Connect daily talking and play with ordinary care rather than treating learning as a separate
        intensive course.
      - If a caregiver is struggling, seek support for the adult as well as for the child.
    zh:
      - 用指南了解可以向儿保或早期支持服务询问哪些帮助。
      - 将说话、游戏与日常照护结合，不把学习变成额外的密集课程。
      - 照顾者遇到困难时，同时为成人和孩子寻找支持。
  limits:
    en: >-
      A service guideline is not an individual developmental assessment or a treatment plan. The evidence for
      organised interventions cannot be transferred directly to a self-help article.
    zh: 服务指南不是个体发展评估或治疗方案。有组织干预的证据不能直接转移到一篇自助文章上。
  access:
    en: >-
      The official publication page and linked WHO files are free to access. Language editions and translation
      or reuse permissions must be checked separately.
    zh: 官方发布页及关联 WHO 文件可免费获取；各语言版本及翻译、转载许可应另行核对。
  checkedNote:
    en: >-
      Verified the official 2020 publication page, overview and recommendation summary. The full guideline
      download could not be read in this check; individual recommendations and evidence tables were not
      independently reassessed.
    zh: 已核对 2020 年官方发布页、概述与推荐概要。本次未能读取完整指南下载；未独立重评各项推荐与证据表。
  backedBy:
    - jeong-2021-parenting-interventions
  checked: "2026-11-14"
  originalTitle: "Improving early childhood development: WHO guideline"
- id: who-parenting-interventions-2023
  type: guideline
  evidence: guideline
  title:
    en: "WHO parenting guidelines: nonviolent care and stronger relationships"
    zh: WHO 养育干预指南：非暴力照护与亲子关系
  by: World Health Organization
  year: 2023
  url: https://www.who.int/publications/i/item/9789240065505
  language: English
  free: true
  minMonths: 0
  maxMonths: 215
  sex: all
  topics:
    - discipline
    - communication
    - responsive-care
    - mental-health
  summary:
    en: >-
      Guidance on structured parenting interventions to reduce maltreatment and harsh parenting, strengthen
      parent–child relationships, and prevent emotional and behavioural problems.
    zh: 针对有结构的养育干预，关注减少虐待与严厉养育、改善亲子关系，以及预防情绪和行为问题。
  purpose:
    en: What distinguishes evidence-based parenting support from a collection of discipline tips?
    zh: 有证据支持的养育服务，与零散的管教技巧有什么区别？
  audience:
    en: >-
      The guideline covers caregivers of children aged 0–17. It is principally for programme and service
      decision-makers; families can use it to understand and ask about support.
    zh: 原指南覆盖 0–17 岁儿童的照顾者，主要供项目和服务决策者使用；家庭可借此了解并询问支持服务。
  whyAge:
    en: >-
      The full age range is covered, but a programme for a toddler is not automatically appropriate for a
      teenager. Check the intervention’s own population and delivery conditions.
    zh: 虽然覆盖全年龄，但学步期项目不能自动用于青春期；需查看具体干预的人群和实施条件。
  keyPoints:
    en:
      - Parenting support aims to reduce violence and improve relationships, not simply secure obedience.
      - Programmes have structured content and delivery conditions.
      - Parent and child mental health are part of the intended outcomes.
    zh:
      - 养育支持关注减少暴力与改善关系，不只是让孩子服从。
      - 项目有具体内容结构与实施条件。
      - 家长和儿童的心理健康也是关注的结果。
  actions:
    en:
      - Use the guideline as a reference when choosing a parenting-support programme.
      - Ask a provider which ages the programme covers, how staff are trained and what support is available.
      - Explore the linked PLH resource for examples of materials, keeping its training conditions in mind.
    zh:
      - 选择养育支持项目时，用本指南了解其依据和目标。
      - 向服务提供者询问适用年龄、人员培训和可获得的支持。
      - 通过关联的 PLH 资源了解材料示例，并保留其培训条件。
  limits:
    en: >-
      This does not establish that every positive-parenting tip works, or that reading guidance equals taking
      part in an evaluated programme. It does not replace safeguarding or mental-health services.
    zh: 这不等于证明每条“积极养育”技巧都有效，也不等于阅读指南就完成了经过评估的项目；它不能代替儿童保护或心理健康服务。
  access:
    en: >-
      WHO provides a free publication and evidence annex. Availability does not automatically authorise
      translating or reproducing all programme materials.
    zh: WHO 提供免费出版物及证据附件；可获取不自动代表可以翻译或复用所有项目材料。
  checkedNote:
    en: >-
      Verified the official 10 February 2023 publication record, its overview and evidence-annex link. No
      independent reassessment of recommendation certainty was performed.
    zh: 已核对 2023 年 2 月 10 日官方发布记录、概述与证据附件入口；未独立重评推荐确定性。
  checked: "2026-11-14"
  originalTitle: >-
    WHO guidelines on parenting interventions to prevent maltreatment and enhance parent–child relationships
    with children aged 0–17 years
- id: parenting-for-lifelong-health
  type: guide
  evidence: expert
  title:
    en: "Parenting for Lifelong Health: family materials and programmes"
    zh: Parenting for Lifelong Health：家庭材料与养育项目
  by: WHO and Parenting for Lifelong Health partners
  year: null
  url: https://www.who.int/teams/social-determinants-of-health/parenting-for-lifelong-health
  language: English
  free: true
  minMonths: 24
  maxMonths: 215
  sex: all
  topics:
    - communication
    - discipline
    - emotions
    - responsive-care
  summary:
    en: >-
      A collection of parenting programmes and materials, including resources for families with children aged
      2–9 and young people aged 10–17. It focuses on relationships and preventing violence.
    zh: 一组养育项目与材料，包括面向 2–9 岁儿童家庭和 10–17 岁青少年家庭的资源，重点是亲子关系与预防暴力。
  yearNote:
    en: Programme collection; editions vary
    zh: 项目资源集合，各手册版本不同
  purpose:
    en: >-
      Where can families find structured examples of positive interaction, communication and managing
      difficult situations?
    zh: 哪里可以找到积极互动、沟通和应对困难情境的结构化材料示例？
  audience:
    en: >-
      This selection focuses on the young-children programme (2–9) and teen programme (10–17). Other PLH
      programmes have different age ranges. Manuals for facilitators and materials for families serve
      different roles.
    zh: 本条精选幼儿与儿童项目（2–9 岁）和青少年项目（10–17 岁）。其他 PLH 项目有不同年龄范围；带领者手册与家庭材料的用途不同。
  whyAge:
    en: >-
      Choose the programme and family material for the relevant age. Do not combine rules from different
      manuals into one universal plan.
    zh: 按年龄选择项目和家庭材料，不把不同手册的规则拼成一套通用方案。
  keyPoints:
    en:
      - The suite was designed with low-resource settings in mind.
      - The official collection separates family materials from facilitator manuals.
      - WHO states that the manuals should be accompanied by training through implementing partners.
    zh:
      - 这组项目考虑了资源有限地区的实施条件。
      - 官方目录将家庭材料与带领者手册分开列出。
      - WHO 说明，手册应配合实施伙伴提供的培训使用。
  actions:
    en:
      - Start at the official manuals page and choose a parent handbook or family guidebook for the age group.
      - Use the family material to understand the programme and prepare questions for a provider.
      - >-
        If considering running sessions for others, contact an implementing partner about training and
        permissions.
    zh:
      - 从官方手册目录选择相应年龄的家长手册或家庭指南。
      - 通过家庭材料了解项目，并准备向服务提供者提出的问题。
      - 若计划带领其他家庭开展课程，先向实施伙伴了解培训与许可。
  limits:
    en: >-
      An open-access manual is not a self-contained substitute for the evaluated programme. WHO describes
      non-profit use, but permissions, language adaptations and training conditions must be checked for each
      manual.
    zh: 开放获取的手册不能单独替代经过评估的完整项目。WHO 说明材料面向非营利使用，但每本手册的许可、语言适配和培训条件仍需分别核对。
  evidenceNote:
    en: >-
      A programme and materials entry, not a clinical guideline or a claim that every PLH variant has
      identical evidence.
    zh: 本条是项目与材料入口，不是临床指南，也不表示所有 PLH 版本具有相同证据。
  sourceLinks:
    - label:
        en: Official manuals and family materials
        zh: 官方手册与家庭材料目录
      url: >-
        https://www.who.int/teams/social-determinants-of-health/parenting-for-lifelong-health/programme-manuals
    - label:
        en: PLH parent handbook for young children
        zh: PLH 儿童项目家长手册
      url: >-
        https://www.who.int/publications/m/item/parenting-for-lifelong-health-programme-for-young-children---parent-handbook
    - label:
        en: PLH family guidebook for parents and teens
        zh: PLH 青少年家庭指南
      url: https://www.who.int/publications/m/item/parenting-for-lifelong-health-for-teens---family-guidebook
  access:
    en: >-
      The WHO collection provides free materials. The two English family editions checked use CC BY-NC-ND 4.0:
      do not republish translations or adaptations without permission. This page only introduces and links to
      the materials.
    zh: WHO 目录提供免费材料。已核对的两份英文家庭版本采用 CC BY-NC-ND 4.0，未经许可不得翻译或改编后发布。本页只提供介绍与外链。
  checkedNote:
    en: >-
      Read the WHO overview and manuals directory, and the opening and licence pages of the young-children
      Parent Handbook (fifth edition, March 2018) and teen Family Guidebook (third edition, March 2018). This
      was not a full programme review.
    zh: 已读 WHO 概述与手册目录，以及儿童家长手册（第五版，2018 年 3 月）、青少年家庭指南（第三版，2018 年 3 月）的开篇与许可页；未审读完整项目。
  checked: "2026-11-14"
  originalTitle: Parenting for Lifelong Health
- id: vroom-everyday-moments
  type: guide
  evidence: expert
  title:
    en: "Vroom: small interactions in everyday moments"
    zh: Vroom：日常生活中的简短亲子互动
  by: Bezos Family Foundation
  year: null
  url: https://www.vroom.org/
  language: English
  free: true
  minMonths: 0
  maxMonths: 71
  sex: all
  topics:
    - responsive-care
    - play
    - language
    - communication
  summary:
    en: >-
      Free activity tips that fit into meals, getting dressed, travel and other shared moments, with brief
      explanations of the ideas behind them.
    zh: 把简短活动融入吃饭、穿衣、出门等共同生活时刻的免费提示，并附背后理念的简要说明。
  yearNote:
    en: Ongoing activity collection
    zh: 持续提供的活动集合
  purpose:
    en: How can a busy family find a small, manageable way to interact without preparing a lesson?
    zh: 忙碌家庭怎样找到无需备课、容易开始的小互动？
  audience:
    en: >-
      Parents and caregivers of children from birth through age 5. Select tips for the child’s age and adapt
      them to communication style, interests and access needs.
    zh: 出生至 5 岁儿童的父母及其他照顾者。按年龄选择提示，并照顾孩子的表达方式、兴趣和可访问性需要。
  whyAge:
    en: >-
      The service focuses on early childhood. It is not a substitute for resources designed for school-age
      children or teenagers.
    zh: 服务聚焦儿童早期，不能代替面向学龄儿童和青少年的资源。
  keyPoints:
    en:
      - The official site describes more than 1,000 free activity tips.
      - >-
        The approach encourages looking, following the child’s interest, talking, taking turns and extending
        an exchange.
      - The site offers routes to app-based and printable materials.
    zh:
      - 官方介绍提供超过 1,000 条免费活动提示。
      - 方法强调观察、跟随兴趣、交谈、轮流和适当延伸交流。
      - 网站提供 App 与可打印材料的入口。
  actions:
    en:
      - Try one tip that fits something you are already doing together.
      - Let the child respond in their own way; shorten or change the activity if needed.
      - Use the official print route if that suits you better than an app.
    zh:
      - 从已经会一起做的日常事情中，选一条合适的提示。
      - 让孩子用自己的方式回应，需要时缩短或调整活动。
      - 如果比 App 更方便，可从官方打印入口选择材料。
  limits:
    en: >-
      The provider’s science explanation is not independent proof that each tip produces a particular outcome.
      Avoid treating activities as a daily performance target or a developmental assessment.
    zh: 提供方的科学说明不等于独立证明每条提示都有特定效果。不要把活动当每日绩效任务或发展评估。
  evidenceNote:
    en: >-
      Curated practical resource; its website’s account of the science is distinct from an independent
      effectiveness review.
    zh: 精选实用资源；官网对科学依据的介绍与独立效果综述需要区分。
  access:
    en: >-
      The English site and its linked activity options are free according to the provider; a Spanish route is
      also offered. App and web-app features may have their own account and privacy conditions.
    zh: 提供方说明英文网站及关联活动选项免费，并提供西语入口。App 和网页应用的具体功能可能有各自的账号与隐私条件。
  sourceLinks:
    - label:
        en: The science behind Vroom
        zh: Vroom 的科学说明
      url: https://www.vroom.org/science
  checkedNote:
    en: >-
      Read the official home and science pages, including the age focus and free-material description. Did not
      audit every tip, app feature or language edition.
    zh: 已读官方首页与科学说明页，核对年龄定位和免费材料介绍；未逐项审核全部提示、App 功能或语言版本。
  checked: "2026-11-14"
  originalTitle: Vroom
- id: whitehead-aims-of-education
  type: classic
  evidence: expert
  title:
    en: "The Aims of Education: Whitehead on knowledge and life"
    zh: 怀特海《教育的目的》：让知识与生活相连
  by: Alfred North Whitehead
  year: 1929
  url: https://plato.stanford.edu/entries/whitehead/
  language: English
  free: true
  minMonths: 72
  maxMonths: 215
  sex: all
  topics:
    - learning
  summary:
    en: >-
      A classic reflection on education that challenges “inert ideas”: knowledge received but never used,
      tested or connected with experience. This introduction draws on a scholarly account of the book.
    zh: 一部反思教育目的的经典著作，批评只被记住、却没有运用、检验或联系经验的“惰性观念”。本导读依据权威学术条目对该书的介绍。
  purpose:
    en: Why can a child remember an answer but struggle to understand or use the idea?
    zh: 为什么孩子记得答案，却难以理解或运用其中的知识？
  audience:
    en: >-
      For caregivers reflecting on learning, particularly during school age and adolescence. The age tags are
      our editorial placement, not Whitehead’s developmental norms or a reading assignment for children.
    zh: 供照顾者思考学习，重点关联学龄期与青春期。年龄标签是本站编辑关联，不是怀特海提出的发展常模，也不是给孩子布置的书目。
  whyAge:
    en: >-
      As schoolwork becomes more formal, this reading offers a question about meaning and application. Its
      educational rhythm is recurrent, not a fixed sequence of child ages.
    zh: 学习更系统后，可以借此思考意义与应用。他谈的教育节奏反复发生，不是按儿童年龄排定的固定阶段。
  keyPoints:
    en:
      - Education involves using and connecting knowledge, not collecting disconnected facts.
      - >-
        Romance, precision and generalisation describe a recurring rhythm of exploration, disciplined learning
        and application.
      - Interest and experience matter alongside technique and detail.
    zh:
      - 教育包括运用和联系知识，不只是收集零散事实。
      - 浪漫、精确与综合运用，描述探索、系统学习和应用之间反复发生的节奏。
      - 兴趣和经验与技能、细节同样值得关注。
  actions:
    en:
      - >-
        After learning something, invite the child to connect it with a question, example or small project
        that matters to them.
      - >-
        Use the text to reflect on the balance between exploration and practice, not to impose a new
        timetable.
    zh:
      - 学过一个内容后，邀请孩子把它联系到在意的问题、例子或小项目。
      - 借原著反思探索与练习的配合，不用它另订一套强制时间表。
  limits:
    en: >-
      This is educational philosophy, not an experiment establishing a teaching method’s effectiveness. The
      suggested use is our reflection prompt. This page is not a review of the whole book or a verified
      Chinese translation.
    zh: 这是教育哲学，不是验证某种教法效果的实验。“可以怎么用”是本站的思考提示；本页不是全书评介，也不是核定的中文译本。
  access:
