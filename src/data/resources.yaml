      The linked Stanford Encyclopedia of Philosophy entry is free scholarly commentary with book references
      and excerpts; it is not the full book. Availability and cost of book editions vary.
    zh: 所链接的斯坦福哲学百科条目可免费阅读，含书目和原文节选；它不是全书。各书籍版本的可获得性与费用不同。
  checkedNote:
