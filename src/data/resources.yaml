    zh: 已读斯坦福条目中的教育哲学讨论，并核对 1929 年书目；未通读全书或核定具体中文版本。
  evidenceNote:
    en: >-
      Historical educational philosophy. Contemporary research must be considered separately for claims about
      a particular activity.
    zh: 历史教育哲学；若要判断某项具体活动的效果，需另看当代研究。
