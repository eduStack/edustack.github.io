  by: Madigan et al., JAMA Pediatrics
  year: 2020
  url: https://doi.org/10.1001/jamapediatrics.2020.0327
  doi: 10.1001/jamapediatrics.2020.0327
  language: English
  free: false
  minMonths: 0
  maxMonths: 155
  sex: all
  topics: [screen-time, language]
