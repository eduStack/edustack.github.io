    en: "Beyond the 30-Million-Word Gap: Children's Conversational Exposure Is Associated With Language-Related Brain Function"
    zh: 超越“三千万词汇差距”：对话轮次与儿童大脑语言功能的关联
  by: Romeo et al., Psychological Science
  year: 2018
  url: https://doi.org/10.1177/0956797617742725
  doi: 10.1177/0956797617742725
  language: English
  free: false
  minMonths: 36
  maxMonths: 83
  sex: all
  topics: [language]
  summary:
    en: In a study of 4- to 6-year-olds, the number of back-and-forth conversational turns with adults predicted activity in language areas of the brain better than the number of words children heard.
    zh: 对 4–6 岁儿童的研究发现，与大人来回对话的次数，比听到的词汇量更能预测大脑语言区的活动。
  whyAge:
    en: The children studied were 4 to 6. We list it from age 3 because the advice it supports, talking with your child, applies from the preschool years.
    zh: 研究对象为 4–6 岁儿童。我们从 3 岁开始推荐，因为它支持的做法（和孩子多来回对话）适用于整个学龄前阶段。
