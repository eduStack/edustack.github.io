    - { en: "A guided-play review found advantages over direct instruction for some early learning outcomes, with no advantage on others. This does not test Vygotsky's whole theory.", zh: "引导式游戏综述发现，部分早期学习结果优于直接教学，其他结果未见优势；这不是对维果茨基整套理论的检验。", src: skene-2022-guided-play }
  outdated:
