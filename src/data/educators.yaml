# Publication: draft | in-review | published | needs-review. Only published items reach the site.
# Classic educators. Every line names its source: a key in sources.yaml or a resource id.
# topics: shared resource subjects; distinct from historical directions and citation keys.
# supported / outdated: what modern research backs up, and what it does not.
# texts: checked free editions; public-domain status can vary by territory and translation.
# reviewed is the local editorial review date, not a new online source-check date.
- id: confucius
  birthYear: -551
  origin: east-asia
  directions: [confucian]
  topics: [learning]
  publicationStatus: published
  name:
    en: Confucius
    zh: 孔子
  years: 551–479 BCE (traditional dates)
  region:
    en: China
    zh: 中国
  role:
    en: Teacher and philosopher
    zh: 教师与哲学思想家
  question:
    en: How can I adapt my help to the child in front of me?
    zh: 怎样按孩子的实际情况调整帮助？
  works:
    - title:
        en: Analects
        zh: 《论语》
      note:
        en: >-
          Compiled by disciples and later followers. The linked Legge English text contains the twenty
          Analects books, without the Chinese text or Legge’s full commentary. Compare specific passages and
          translations rather than treating one rendering as definitive.
        zh: 由弟子及后学记录编纂。链接的理雅各英文文本含《论语》二十篇，不含中文原典或完整注释；应对照具体章句和译本，不将一个英译视为定论。
      src: sep-confucius
  basis:
    en: >-
      Based on the recorded SEP introduction and selected Analects passages linked here. This is a short
      thematic introduction, not a complete reading of all textual layers or commentaries.
    zh: 依据已有 SEP 学术介绍与所链接的《论语》选定章句整理，是主题短导读，未完成全部文本层次和注疏的审读。
  reviewed: "2026-11-17"
  bio:
    en: >-
      Teacher and thinker of ancient China whose sayings and conversations were compiled by disciples and
      later followers in the Analects.
    zh: 中国古代教师和思想家，其言论与对话由弟子及后学记录编纂为《论语》。
    src: sep-confucius
  ideas:
    - en: >-
        Learning and thinking go together: "Learning without thinking is useless; thinking without learning is
        dangerous."
      zh: 学习和思考缺一不可：“学而不思则罔，思而不学则殆。”
      src: analects-2
    - en: >-
        Teach each student according to who they are: asked the same question by two students, he gave them
        opposite advice. Later scholars summed this up as "teaching according to aptitude" (因材施教).
      zh: 根据学生的情况教：两个学生问同一个问题，他给了相反的回答。后人把这种做法概括为“因材施教”。
      src: analects-11
    - en: "Education is for everyone: \"In teaching there should be no distinction of classes.\""
      zh: 教育面向所有人：“有教无类。”
      src: analects-15
  today:
    en: >-
      Our family reflection: notice what your child already understands and how they reason, then adjust the
      help you offer.
    zh: 本站家庭借鉴：先观察孩子已经理解什么、怎样思考，再调整帮助的方式。
    src: analects-11
  supported:
    - en: >-
        Teaching children at their actual level, rather than strictly by grade, raised learning in large
        randomised trials.
      zh: 大规模随机试验发现，按孩子的实际水平教学，而不是死板地按年级进度，能提高学习成绩。
      src: banerjee-2017-tarl
  outdated:
    - en: >-
        The Analects belongs to an ancient setting of ritual and unequal social roles. Its moral authority
        does not make every historical hierarchy a rule for families today.
      zh: 《论语》处于古代礼制与不平等社会角色的背景中，不能因其道德影响就把历史等级关系当作今天家庭的规范。
      src: sep-confucius
  texts:
    - label:
        en: Analects, original Chinese (Wikisource)
        zh: 《论语》原文（维基文库）
      url: https://zh.wikisource.org/wiki/論語
    - label:
        en: Analects, James Legge English translation (Project Gutenberg)
        zh: 《论语》理雅各英译本（古登堡计划）
      url: https://www.gutenberg.org/ebooks/3330

- id: rousseau
  birthYear: 1712
  origin: europe
  directions: [child, freedom]
  topics: [learning, development]
  publicationStatus: published
  name:
    en: Jean-Jacques Rousseau
    zh: 卢梭
  years: 1712–1778
  region:
    en: Geneva and France
    zh: 日内瓦、法国
  role:
    en: Philosopher and writer on education
    zh: 哲学家与教育思想作者
  question:
    en: How much room should a child have to learn from experience?
    zh: 该给孩子多少从经验中学习的空间？
  works:
    - title:
        en: Emile, or On Education
        zh: 《爱弥儿》
      note:
        en: >-
          First published in 1762; the linked electronic text is Barbara Foxley’s English translation in five
          books. It is a philosophical education narrative, not a childcare manual, and its gender assumptions
          in Book V require critical reading.
        zh: 1762年初版，链接电子文本为 Barbara Foxley 英译五卷。这是哲学教育叙事，不是育儿手册；第五卷性别假设须批判阅读。
      src: emile-text
  basis:
    en: >-
      Uses the recorded SEP discussion, the linked edition's book information and selected Book V material,
      alongside discovery-learning research. The complete work and Chinese translations have not been
      reviewed.
    zh: 依据已有 SEP 讨论、链接版本书目信息及第五卷选定材料，并与发现学习研究对读；未通读全书或完整审读中文译本。
  reviewed: "2026-11-17"
  bio:
    en: >-
      Philosopher whose novel-treatise Emile set out an education that follows the child's natural
      development.
    zh: 哲学家，在《爱弥儿》中提出顺应孩子天性发展的教育。
    src: sep-rousseau
  ideas:
    - en: >-
        Child-centred "negative education": education should work in harmony with the development of the
        child's natural capacities.
      zh: 以儿童为中心的“消极教育”：教育应当顺应孩子天生能力的发展。
      src: sep-rousseau
    - en: Children should learn from experience and discovery more than from books and lectures.
      zh: 孩子应当更多从亲身经验和自己发现中学习，而不是靠书本和说教。
      src: sep-rousseau
  today:
    en: >-
      Our family suggestion: offer manageable chances to try, while providing examples, feedback or help when
      needed.
    zh: 本站家庭建议：提供能力范围内的尝试机会，需要时给出示范、反馈或帮助。
    src: alfieri-2011-discovery
  supported:
    - en: Discovery learning works when it comes with support such as feedback and examples.
      zh: 有支持（反馈、示范）的发现式学习是有效的。
      src: alfieri-2011-discovery
  outdated:
    - en: Leaving children to discover things entirely alone teaches less than explicit teaching.
      zh: 完全让孩子自己摸索，学到的比直接讲解少。
      src: alfieri-2011-discovery
    - en: >-
        Book V of Emile says a woman "is made to please and to be in subjection to man" - a view of girls'
        education modern readers reject.
      zh: 《爱弥儿》第五卷称女性“生来是为了取悦男性并服从男性”，这种女子教育观今天已被摒弃。
      src: emile-text
  texts:
    - label:
        en: Emile, English translation (Project Gutenberg)
        zh: 《爱弥儿》英译本（古登堡计划）
      url: https://www.gutenberg.org/ebooks/5427

- id: froebel
  birthYear: 1782
  origin: europe
  directions: [child, experience]
  topics: [learning, play]
  publicationStatus: published
  name: { en: Friedrich Froebel, zh: 福禄贝尔 }
  years: "1782–1852"
  region: { en: Germany, zh: 德国 }
  role: { en: "Educator and kindergarten founder", zh: "教育实践者与幼儿园创始人物" }
  question: { en: "What can play offer, and when should I join in?", zh: "游戏能带来什么，大人何时参与？" }
  works:
    - title: { en: "Autobiography of Friedrich Froebel", zh: "《福禄贝尔自传》" }
      note: { en: "The checked Gutenberg record identifies the 1889 English edition translated and annotated by Emilie Michaelis and H. Keatley Moore. Read for historical background, not as a tested play programme.", zh: "已核验的 Gutenberg 书目标明 1889 年英文版，由 Emilie Michaelis 与 H. Keatley Moore 翻译并注释。适合了解历史背景，不是经过验证的游戏课程。" }
      src: froebel-autobiography
  basis: { en: "Uses recorded biographical and Froebel Trust introductions, the autobiography's catalogue record, and modern guided-play research. No complete reading of Froebel's original works is claimed.", zh: "依据已有传记与 Froebel Trust 介绍、自传目录记录及现代引导式游戏研究，未声称通读福禄贝尔原著。" }
  reviewed: '2026-11-17'
  bio: { en: "German educator who founded the kindergarten and put play at the centre of early education.", zh: "德国教育家，创办了“幼儿园”，把游戏放在早期教育的中心。", src: brit-froebel }
  ideas:
    - { en: "Play is young children's main way of learning.", zh: "游戏是幼儿最主要的学习方式。", src: brit-froebel }
    - { en: "Children learn through their own activity, using simple materials such as blocks and shapes (his \"gifts\").", zh: "孩子通过自己动手来学习，用积木、几何形体等简单材料（他称为“恩物”）。", src: brit-froebel }
  today: { en: "Our family suggestion: leave room for child-led play and sometimes offer a question, hint or manageable challenge. This is an editorial example, not a tested Froebel activity.", zh: "本站家庭建议：保留孩子主导的游戏空间，适时提供问题、提示或力所能及的挑战。这是编辑举例，不是已验证的福禄贝尔活动。", src: skene-2022-guided-play }
  supported:
    - { en: "A review covering studies of children aged 1–8 found advantages of guided play over direct instruction for some outcomes, including early maths and shape knowledge. This does not establish benefits for every age, skill or Froebel programme.", zh: "一项涵盖 1–8 岁儿童研究的综述发现，引导式游戏在早期数学、图形知识等部分结果上优于直接教学；不能推断每个年龄、所有技能或福禄贝尔课程都有同样收益。", src: skene-2022-guided-play }
  outdated:
    - { en: "Free play on its own did less for some skills, such as spatial words, than play with guidance.", zh: "单纯的自由玩耍在某些能力（比如空间词汇）上不如有引导的游戏。", src: skene-2022-guided-play }
  texts:
    - { label: { en: "Autobiography of Friedrich Froebel (Project Gutenberg)", zh: "《福禄贝尔自传》英译本（古登堡计划）" }, url: "https://www.gutenberg.org/ebooks/16434" }

- id: montessori
  birthYear: 1870
  origin: europe
  directions: [child, experience]
  topics: [learning, development]
  publicationStatus: published
  name:
    en: Maria Montessori
    zh: 蒙台梭利
  years: 1870–1952
  region:
    en: Italy
    zh: 意大利
  role:
    en: Physician and educator
    zh: 医生与教育实践者
  question:
    en: How can the home help a child do more independently?
    zh: 怎样安排家庭环境，让孩子多做一点自己的事？
  works:
    - title:
        en: The Montessori Method
        zh: 《蒙台梭利方法》
      note:
        en: >-
          The 1912 English edition was translated by Anne E. George, with an introduction by Henry W. Holmes.
          Begin with observation and environment in Chapter IV and discipline in Chapter V; the historical
          diet and health sections are not current medical guidance.
        zh: 1912年英文版由 Anne E. George 译、Henry W. Holmes 作导论。可从第四章观察与环境、第五章纪律入手；历史饮食及健康章节不能当作现行医疗指南。
      src: montessori-method-text
  basis:
    en: >-
      Uses biographical and AMI explanations, the 1912 edition’s title page and contents, and selected
      observation/environment passages in Chapter IV. The whole book has not been read; school research does
      not validate our family example.
    zh: 依据传记与 AMI 说明、1912年版题页目录及第四章观察与环境选段，未通读全书；学校研究不能直接验证本站家庭示例。
  reviewed: "2026-11-17"
  bio:
    en: Italian physician and educator who developed the Montessori method in the early 1900s.
    zh: 意大利医生和教育家，20 世纪初创立了蒙台梭利教学法。
    src: brit-montessori
  ideas:
    - en: Children choose their own activities and move freely, rather than sitting at desks.
      zh: 孩子自己选择活动、自由走动，而不是坐在课桌前听讲。
      src: brit-montessori
    - en: Specially designed hands-on materials that appeal to the senses.
      zh: 使用专门设计、调动感官的动手材料。
      src: brit-montessori
    - en: Children are challenged according to their ability, and help each other learn.
      zh: 按每个孩子的能力给出挑战，鼓励孩子互相教。
      src: brit-montessori
    - en: >-
        Chapter IV connects observation with children’s spontaneous activity and describes furniture and
        washing facilities designed for their independent use.
      zh: 第四章将观察与儿童自发活动联系起来，并描述便于儿童自主使用的桌椅、盥洗设施等环境安排。
      src: montessori-method-text
  today:
    en: >-
      Our family interpretation: make a few suitable activities accessible and let children take part in real
      tasks with help matched to their ability.
    zh: 本站家庭借鉴：让几样合适的活动容易取用，并按孩子的能力提供帮助，让他们参与真实小事。
    src: brit-montessori
  supported:
    - en: >-
        A systematic review of 32 studies found Montessori pupils did somewhat better, academically and in
        executive function.
      zh: 一项汇总 32 项研究的系统综述发现，蒙台梭利学生在学业和执行功能上表现略好。
      src: randolph-2023-montessori
    - en: >-
        In a lottery-based study, Montessori preschool narrowed the gap between lower- and higher-income
        children.
      zh: 一项抽签入学的追踪研究发现，蒙台梭利幼儿园缩小了不同收入家庭孩子之间的差距。
      src: lillard-2017-montessori
  outdated:
    - en: >-
        Benefits were larger in preschool and primary than in secondary school, and some outcomes rest on
        low-quality evidence.
      zh: 效果在幼儿园和小学阶段更明显，中学阶段较小；部分结果的证据质量较低。
      src: randolph-2023-montessori
  texts:
    - label:
        en: The Montessori Method (Project Gutenberg)
        zh: 《蒙台梭利方法》英译本（古登堡计划）
      url: https://www.gutenberg.org/ebooks/39863

- id: dewey
  birthYear: 1859
  origin: north-america
  directions: [experience, justice]
  topics: [learning]
  publicationStatus: published
  name:
    en: John Dewey
    zh: 杜威
  years: 1859–1952
  region:
    en: United States
    zh: 美国
  role:
    en: Philosopher and educational reformer
    zh: 哲学家与教育改革者
  question:
    en: How can a hands-on activity become a chance to think?
    zh: 怎样让动手活动也成为思考的机会？
  works:
    - title:
        en: Democracy and Education
        zh: 《民主主义与教育》
      note:
        en: >-
          Published in 1916. Chapter XI connects action with noticing and understanding its consequences:
          activity alone does not constitute meaningful experience. This is not a ready-made family project
          curriculum.
        zh: 1916 年出版。第十一章把行动与觉察、理解其后果联系起来；仅仅参加活动并不自动形成有意义的经验。这不是现成的家庭项目课程。
      src: dewey-democracy-text
    - title:
        en: How We Think
        zh: 《我们怎样思维》
      note:
        en: >-
          The linked text is the 1910 edition, not the 1933 revision. Chapter I distinguishes a flow of ideas
          from reflection that examines the grounds and implications of a belief.
        zh: 所链接为1910年版，不是1933年修订版。第一章区分思绪流动与考察信念依据、后续含义的反思思考。
      src: dewey-how-we-think
  basis:
    en: >-
      Uses SEP, the opening of Democracy and Education XI and selected reflective-thinking passages in How We
      Think I. Full electronic texts are available, but neither work was read in full. Modern guidance
      research remains a separate comparison.
    zh: 依据 SEP、《民主主义与教育》第十一章开头及《我们怎样思维》第一章反思思考选段；两部电子全文均已取得，但未通读。现代指导学习研究仍是单独对照。
  reviewed: "2026-11-17"
  bio:
    en: American philosopher who founded the Laboratory School in Chicago to test ideas about education.
    zh: 美国哲学家，在芝加哥创办“实验学校”来检验他的教育理论。
    src: sep-dewey
  ideas:
    - en: "Education grows out of experience: children learn by doing and by working on real problems."
      zh: 教育来自经验：孩子在做中学，在解决真实问题中学。
      src: sep-dewey
    - en: School should be connected to community and democratic life, not cut off from it.
      zh: 学校应当和社区、民主生活连在一起，而不是与之隔绝。
      src: sep-dewey
    - en: >-
        Reflection involves examining reasons and consequences, not merely doing an activity or producing an
        answer.
      zh: 反思需要考察理由与后果，不只是做完活动或给出答案。
      src: dewey-how-we-think
  today:
    en: >-
      Our family suggestion: during an everyday problem or activity, offer examples and feedback and invite
      the child to explain their reasoning. This is our application of guidance research.
    zh: 本站家庭建议：一起处理日常问题或活动时，提供示范和反馈，并邀请孩子解释思路。这是本站对指导学习研究的借鉴。
    src: alfieri-2011-discovery
  supported:
    - en: >-
        A meta-analysis distinguished unsupported discovery from discovery with feedback, examples or
        explanation prompts; supported discovery had better outcomes in its comparisons. It did not validate
        project-based learning as a whole or all of Dewey's ideas.
      zh: 一项荟萃分析区分无支持的发现学习与配合反馈、示例或解释提示的发现学习；有支持的发现学习在相应比较中结果更好。这不等于验证整个项目式学习或杜威的全部思想。
      src: alfieri-2011-discovery
  outdated:
    - en: Versions of "learning by doing" that give beginners little guidance do not work well.
      zh: 对初学者几乎不给指导的“做中学”，效果并不好。
      src: kirschner-2006-guidance
    - en: >-
        Chapter XI uses a burn as an example of linking action and consequence. It is an illustration, not
        permission to expose children to avoidable injury.
      zh: 第十一章以烧伤说明行动与后果的联系；这个例子不能作为让孩子承受可避免伤害的依据。
      src: dewey-democracy-text
  texts:
    - label:
        en: Democracy and Education (Project Gutenberg)
        zh: 《民主主义与教育》英文原著（古登堡计划）
      url: https://www.gutenberg.org/ebooks/852
    - label:
        en: How We Think, 1910 (Project Gutenberg)
        zh: 《我们怎样思维》1910年版（古登堡计划）
      url: https://www.gutenberg.org/ebooks/37423

- id: cai-yuanpei
  birthYear: 1868
  origin: east-asia
  directions: [humanist, justice]
  topics: [learning]
  publicationStatus: published
  name: { en: Cai Yuanpei, zh: 蔡元培 }
  years: "1868–1940"
  region: { en: China, zh: 中国 }
  role: { en: "Education administrator and university reformer", zh: "教育行政与大学改革者" }
