      src: cai-1917
  basis: { en: "Based on the recorded biography and the two linked Chinese articles, with current physical-activity guidance as a separate comparison. No complete collected works or causal effects of aesthetic education were reviewed.", zh: "依据已有传记及所链接的两篇中文文章，另以现行身体活动指南对照；未审读全集，也未验证美育的因果效果。" }
  reviewed: '2026-11-17'
  bio: { en: "First minister of education of the Republic of China (1912) and head of Peking University from 1916 to 1926.", zh: "中华民国首任教育总长（1912），1916–1926 年主持北京大学。", src: brit-cai }
  ideas:
    - { en: "Five kinds of education should all be developed together: physical and military, practical, civic morality, worldview, and aesthetic education.", zh: "五育并举：军国民教育、实利主义教育、公民道德教育、世界观教育、美感教育，“皆今日之教育所不可偏废者也”。", src: cai-1912 }
    - { en: "Aesthetic education - art and beauty - can do for character what religion once did.", zh: "“以美育代宗教”：用艺术和美的教育来涵养品格。", src: cai-1917 }
  today: { en: "Our family reflection: look at whether the weekly routine leaves room for movement, art and music alongside schoolwork.", zh: "本站家庭借鉴：看看一周安排中，是否在学业之外给运动、艺术和音乐留下空间。", src: cai-1912 }
  supported:
    - { en: "WHO recommends an average of at least 60 minutes a day of moderate-to-vigorous physical activity across the week for ages 5–17. This supports making room for movement, not Cai's whole five-part scheme.", zh: "WHO 建议 5–17 岁儿童青少年一周内平均每天至少进行 60 分钟中高强度身体活动。这支持为运动留出时间，不能验证蔡元培的整套五育方案。", src: who-activity-2020 }
  outdated:
    - { en: "He presented military-citizen education as a need of his time, given the threats China faced in 1912.", zh: "他把“军国民教育”说成是当时形势下“不能不采”的做法，带有那个时代的背景。", src: cai-1912 }
  texts:
