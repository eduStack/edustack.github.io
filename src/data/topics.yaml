- id: planning-together
  publicationStatus: published
  name: { en: "Make a small plan together", zh: "和孩子一起商量一件事" }
  teaser: { en: "Choose something manageable, talk through a first step, and adjust together.", zh: "选一件小事，一起商量第一步，再根据实际情况调整。" }
  status: ready
  updated: "2026-11-17"
  tags: [communication, self-regulation, learning]
  bottomLine:
    en: "Choose one manageable everyday task and invite your child to help decide a next step. Offer support and adjust to their interest; a plan can change. These are editorial practice ideas, not an assessment or a tested intervention."
    zh: "从一件做得到的日常小事开始，邀请孩子一起商量下一步；按兴趣提供帮助，计划也可以改变。这里是本站整理的实践思路，不是能力评估或经过效果验证的干预。"
  sections:
    - id: small-start
      title: { en: "Start small and share the thinking", zh: "从小事开始，一起想办法" }
      text:
        en: "The Harvard activity guide describes remembering information, pausing and changing approach, with support adjusted to the child. Our interpretation is to make a familiar daily task manageable: ask what matters to the child, agree on one next step and help where needed. The specific outing and project examples below are our designs, not Harvard protocols."
        zh: "哈佛活动指南解释了记住信息、停一停及调整做法，并强调成人根据孩子情况提供帮助。本站据此整理的思路是：从熟悉、做得到的日常任务开始，问问孩子在意什么，商量下一步，需要时提供帮助。下面的出游和项目例子由本站设计，不是哈佛的干预流程。"
      citations:
        - src: harvard-executive-function-activities
          note: { en: "The introduction and age-group sections provide background on adult support and practice; they do not validate these original activities.", zh: "导言与分龄章节为成人支持和实践提供背景，不等于验证了本站设计的活动。" }
    - id: room-to-adjust
      title: { en: "A useful plan has room to change", zh: "计划可以调整，也可以暂停" }
      text:
        en: "For these editorial activities, drawing, speaking or moving objects can replace writing. Let the child choose whether to join, and take over practical responsibilities that remain yours. If an activity becomes frustrating, simplify it or stop. Free play and rest do not need a plan. The age ranges help choose a starting point; they are not milestones to pass."
        zh: "在这些本站设计的活动里，可以用画画、说话或摆放物品代替书写。允许孩子选择是否参与，成人仍承担自己的实际责任。遇到挫折时可以简化或停止，自由玩耍和休息无需安排计划。年龄只是选择起点的线索，不是必须通过的成长指标。"
      citations:
        - src: harvard-executive-function-activities
          note: { en: "The guide recommends age-appropriate challenge and adjusting adult help. The choices of format and stopping above are editorial use conditions, not prescribed doses or outcomes.", zh: "指南提供适龄挑战与调整成人帮助的背景；上述表达方式和暂停选择是本站使用条件，不是规定的训练剂量或效果。" }
  activities:
    - activity: preschool-outing-plan
      reason: { en: "For ages 4–5, choose a small part of getting ready together.", zh: "面向4–5岁，一起商量出门准备中的一小部分。" }
    - activity: weekend-one-choice
      reason: { en: "For ages 6–11, make one shared choice for a weekend.", zh: "面向6–11岁，一起决定周末的一项安排。" }
    - activity: small-project-plan
      reason: { en: "For ages 7–11, agree a manageable first step for a small project.", zh: "面向7–11岁，为一个小项目商量做得到的第一步。" }
