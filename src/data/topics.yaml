# picks: books and guidelines only. research: studies shown as "the research behind it".
- id: screen-time
  publicationStatus: published
  name: { en: "Screen time", zh: "屏幕时间" }
  teaser: { en: "How much, at what age, and what counts", zh: "看多久、几岁开始、什么算屏幕时间" }
  status: ready
  updated: 2026-11-15
  bottomLine:
    en: For children under 2, recommendations differ. WHO does not recommend sedentary screen time; the AAP advises avoiding it before 18 months except for video calls, and choosing high-quality content to watch together if introducing it at 18–24 months. For ages 2–5, recommendations generally limit daily viewing to about an hour, with age boundaries and conditions differing by source. For school-age children and teens, WHO advises limiting sedentary time, especially recreational screen use, without a single numerical cap; the AAP recommends consistent family limits, while Australia recommends no more than 2 hours of recreational screen time a day.
    zh: 2 岁以下，各机构的建议存在差异：WHO 不建议久坐看屏幕；美国儿科学会建议 18 个月前除视频通话外避免，18–24 个月如要接触，应选高质量内容并陪看。2–5 岁的建议通常将每天观看时间限于约 1 小时，具体年龄边界和条件需看各机构原文。学龄儿童和青少年阶段，WHO 建议减少久坐，特别是娱乐性屏幕时间，未给统一时长；美国儿科学会建议制定一致的家庭规则；澳大利亚建议娱乐性屏幕时间每天不超过 2 小时。
  sources:
    - name: { en: "World Health Organization", zh: "世界卫生组织" }
      note: { en: "2019 (under 5), 2020 (5–17)", zh: "2019（5 岁以下）、2020（5–17 岁）" }
      resource: who-under5-activity-sleep-2019
    - name: { en: "American Academy of Pediatrics", zh: "美国儿科学会" }
      note: { en: "Media and Young Minds 2016; Family Media Plan", zh: "2016 政策声明；家庭媒体使用计划" }
      resource: aap-media-young-minds-2016
    - name: { en: "Australian Government Department of Health", zh: "澳大利亚卫生部" }
      note: { en: "24-hour movement guidelines", zh: "24 小时运动指南" }
      url: https://www.health.gov.au/topics/physical-activity-and-exercise/physical-activity-and-exercise-guidelines-for-all-australians/for-children-and-young-people-5-to-17-years
  rows:
    - age: { en: "Under 18 months", zh: "18 个月以下" }
      cells:
        - { en: "Not recommended", zh: "不建议" }
        - { en: "Avoid, except video chatting", zh: "除视频通话外避免" }
        - { en: "No screen time", zh: "不看屏幕" }
      verdict: agree
    - age: { en: "18–24 months", zh: "18–24 个月" }
      cells:
        - { en: "Not recommended", zh: "不建议" }
        - { en: "If introduced, choose high-quality programmes and watch together", zh: "如要接触，选高质量节目并陪看" }
        - { en: "No screen time", zh: "不看屏幕" }
      verdict: differ
      verdictNote: { en: "The AAP allows some co-viewing", zh: "美国儿科学会允许少量陪看" }
    - age: { en: "2–5 years", zh: "2–5 岁" }
      cells:
        - { en: "No more than 1 hour; less is better", zh: "不超过 1 小时，越少越好" }
        - { en: "1 hour a day of high-quality programmes", zh: "每天 1 小时高质量节目" }
        - { en: "No more than 1 hour a day", zh: "每天不超过 1 小时" }
      verdict: agree
    - age: { en: "5–17 years", zh: "5–17 岁" }
      cells:
        - { en: "Limit recreational screen time; no number given", zh: "减少娱乐性屏幕时间，未给具体数字" }
        - { en: "Consistent limits set with a family media plan", zh: "用家庭媒体计划定一致的规则" }
        - { en: "No more than 2 hours of recreational screen time a day", zh: "娱乐性屏幕时间每天不超过 2 小时" }
      verdict: differ
      verdictNote: { en: "Only Australia sets a number", zh: "只有澳大利亚给了具体数字" }
