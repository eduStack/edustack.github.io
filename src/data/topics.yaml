- id: social-media
  publicationStatus: published
  name: { en: "Social media", zh: "社交媒体" }
  teaser: { en: "When to allow it and how to talk about it", zh: "什么时候可以用、怎么和孩子谈" }
  status: ready
  updated: 2026-11-13
  bottomLine:
    en: Neither advisory sets a starting age. Both say to make a family plan, protect sleep, and teach your child how social media works before they start - with closer adult involvement in the early teens.
    zh: 两份公告都没有规定开始使用的年龄。它们都建议制定家庭计划、保护睡眠，并在孩子开始使用前教会他们社交媒体是怎么运作的；青春期早期大人要更多参与。
  sources:
    - name: { en: "US Surgeon General", zh: "美国卫生总监" }
      note: { en: "Advisory, 2023", zh: "2023 年公告" }
      resource: us-surgeon-general-social-media-2023
    - name: { en: "American Psychological Association", zh: "美国心理学会" }
      note: { en: "Health advisory, 2023", zh: "2023 年健康建议" }
      resource: apa-social-media-advisory-2023
  rows:
    - age: { en: "Starting age", zh: "开始年龄" }
      cells:
        - { en: "No minimum age set", zh: "未规定最低年龄" }
        - { en: "No minimum age set; depends on maturity and home", zh: "未规定最低年龄，取决于孩子的成熟度和家庭情况" }
      verdict: agree
    - age: { en: "Family rules", zh: "家庭规则" }
      cells:
        - { en: "Make a family media plan; tech-free zones at home", zh: "制定家庭媒体计划；家里设无设备区域" }
        - { en: "Adult monitoring in early adolescence (about 10–14)", zh: "青春期早期（约 10–14 岁）由大人监督" }
      verdict: agree
    - age: { en: "Sleep", zh: "睡眠" }
      cells:
        - { en: "Not addressed as a specific rule", zh: "未作为具体规则提出" }
        - { en: "Protect at least 8 hours; avoid use in the hour before bed", zh: "保证至少 8 小时睡眠；睡前一小时避免使用" }
      verdict: single
    - age: { en: "Before they start", zh: "开始使用之前" }
      cells:
        - { en: "Teach them about technology and responsible use", zh: "教孩子了解技术和负责任地使用" }
        - { en: "Social media literacy training", zh: "学习社交媒体素养" }
      verdict: agree
  picks: [us-surgeon-general-social-media-2023, apa-social-media-advisory-2023, aap-family-media-plan]
