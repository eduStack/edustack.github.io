- id: growth-chart
  toolType: browser-tool
  publicationStatus: published
  kind: internal
  route: /tools/growth-chart/
  storageKey: edustack.growth-chart.v1
  templateSource: practical-tool
  name: { en: "Height and weight record", zh: "身高体重记录" }
  minAge: 0
  maxAge: 17
  subject: general
  by: eduStack
  what: { en: "Record height and weight and calculate a non-diagnostic BMI.", zh: "记录身高体重并计算非诊断性的体重指数。" }
  languages: { en: "English and Chinese", zh: "英文和中文" }
  backing: {"en": "An original eduStack measurement record with a mathematical BMI calculation: weight in kilograms divided by height in metres squared.", "zh": "eduStack 原创测量记录工具，按体重公斤数除以身高米数的平方计算 BMI。"}
  topics: [development]
  relatedResources: []
  purpose: { en: "Keep a simple measurement record before discussing growth with a professional.", zh: "在向专业人员询问前，先保留一份简单的测量记录。" }
  audience: { en: "Families recording routine measurements; it does not calculate percentiles or diagnose.", zh: "记录日常测量的家庭；不计算百分位，也不作诊断。" }
  limits: {"en": "This tool uses no WHO growth curves and provides no percentiles, growth chart or interpretation by age or sex. BMI alone cannot assess a child’s health or growth. Take measurements and any concerns to a qualified professional.", "zh": "本工具不使用 WHO 生长曲线，不提供百分位、生长图或按年龄及性别的结果解释。单独的 BMI 不能判断孩子的健康或生长；请带着测量记录和疑问向专业人员咨询。"}
