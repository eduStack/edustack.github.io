# Publication: draft | in-review | published | needs-review. Only published items reach the site.
# Free learning tools ("what you can do together"). Their own collection also feeds the shared library.
# Every tool must meet the vetting criteria shown on the Tools page:
#   free     - core content free, no subscription
#   noAds    - no advertising found when we last checked
#   privacy  - a public privacy policy or parents' page (we link it; we do not vouch for it)
#   backing  - made by a university or non-profit, or publishes research or evaluation (backingUrl)
# Link checks are scheduled monthly; content, costs and privacy changes need editorial review.
- id: task-breakdown
  toolType: browser-tool
  publicationStatus: published
  kind: internal
  route: /tools/task-breakdown/
  storageKey: edustack.task-breakdown.v1
  templateSource: task-breakdown
  name: { en: "Task breakdown", zh: "任务拆分" }
  minAge: 6
  maxAge: 11
  subject: general
  by: eduStack
  what: { en: "Turn one everyday task into a short, editable list of steps.", zh: "把一件日常任务整理成一份可以编辑的短步骤清单。" }
  languages: { en: "English and Chinese", zh: "英文和中文" }
  backing: { en: "An original eduStack browser tool informed by planning and adult-support guidance.", zh: "eduStack 原创浏览器工具，参考计划和成人支持相关指导。" }
  topics: [learning, communication]
  relatedResources: [harvard-executive-function-activities]
  purpose: { en: "Make a task easier to discuss, adjust and start; it does not assess a child's ability.", zh: "帮助家长和孩子讨论、调整并开始一件事，不评估孩子的能力。" }
  audience: { en: "Families working on a familiar, low-risk task together. Adults remain responsible for safety and essential items.", zh: "一起处理熟悉、低风险任务的家庭。安全和必需物品始终由成人负责。" }
  limits: { en: "This is an organising aid, not a treatment, school assessment or guarantee of better self-regulation. Text stays in this browser when saved.", zh: "这是整理任务的辅助工具，不是治疗、学校评估，也不保证改善自我调节。保存后文字留在这台浏览器中。" }
  access: { en: "Free and runs in the browser. No account is required; saving is optional.", zh: "免费并在浏览器中运行。不需要账号，保存是可选的。" }
  device: { en: "Works in a modern browser; printing is available.", zh: "可在现代浏览器中使用，并支持打印。" }
